name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: unidocs
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: unidocs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unidocs -d unidocs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway database that exists only inside this CI job.
      DATABASE_URL: postgresql://unidocs:ci-only-password@localhost:5432/unidocs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Prepare environment files
        run: |
          cp .env.example .env
          cp .env.example apps/api/.env

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (unit, component and API end-to-end)
        run: npm test

  docker:
    # Checks that the deployment image still builds (the same Dockerfile Render uses).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t unidocs:ci .
